<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Online - E-commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <style>
        .product { border: 1px solid #eee; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .product img { max-width: 100%; height: auto; }
        .products { display: flex; gap: 20px; flex-wrap: wrap; }
        .product { flex: 1 1 250px; max-width: 300px; }
        header, footer { text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    <header>
        <h1>Minha Loja Online</h1>
        <p>Produtos incríveis com pagamento seguro!</p>
    </header>
    <main>
        <section class="products">
            <div class="product">
                <img src="https://via.placeholder.com/250x150?text=Produto+1" alt="Produto 1">
                <h2>Produto 1</h2>
                <p>Descrição breve do produto 1.</p>
                <strong>R$ 99,90</strong>
                <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                    <input type="hidden" name="cmd" value="_xclick">
                    <input type="hidden" name="business" value="seu-email@dominio.com">
                    <input type="hidden" name="item_name" value="Produto 1">
                    <input type="hidden" name="amount" value="99.90">
                    <input type="hidden" name="currency_code" value="BRL">
                    <button type="submit">Comprar com PayPal</button>
                </form>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/250x150?text=Produto+2" alt="Produto 2">
                <h2>Produto 2</h2>
                <p>Descrição breve do produto 2.</p>
                <strong>R$ 149,90</strong>
                <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                    <input type="hidden" name="cmd" value="_xclick">
                    <input type="hidden" name="business" value="seu-email@dominio.com">
                    <input type="hidden" name="item_name" value="Produto 2">
                    <input type="hidden" name="amount" value="149.90">
                    <input type="hidden" name="currency_code" value="BRL">
                    <button type="submit">Comprar com PayPal</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Minha Loja Online</p>
    </footer>
</body>
</html>
