<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        *{ /*Configurações globais das CSS*/
            height: 100%;
        }
        body {
            background-image: linear-gradient(to right, #2101E1, #0400E0 , #4500E0, #6200E1, #7C00E0, #8152E0);
        }
        h1{
            font-family: sans-serif;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Testando gradientes</h1>
</body>
</html>
