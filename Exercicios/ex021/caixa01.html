<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        a{
            border-width: 3px;
            border-style: solid;
            border-color: red;
        }
        a:hover{
            color: blue;
        }
        h1{
            background-color: lightgray;
            height: 300px;
            width: 371px ;

            border-width: 3px;
            border-style: solid;
            border-color: darkslategray;
            /*
                    isso ↑
                    pode ser substituido por 
                    isso ↓
            */
            border: 3px solid darkslategray;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*
                    isso ↑
                    pode ser substituido por 
                    isso ↓
            */
            padding: 10px;

            margin-top: 10px;
            margin-right: 10px;  
            margin-bottom: 10px; 
            margin-left: 10px;
            margin: auto;
            /*
                    isso ↑
                    pode ser substituido por 
                    isso ↓
            */
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>paragrafos também são exemplos de caixas box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
