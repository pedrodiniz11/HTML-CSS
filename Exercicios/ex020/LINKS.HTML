/<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            # = id
            . = classe
            : = pseudo-classe
            :: = pseudo-elemento
            > = filho
        */
        a{
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: purple;
        }
        a:hover{
            color: red;
            text-decoration: underline;
        }
        a:active{
            color: green;
        }
        a::after{
            content: "<<";
            text-decoration: none;
            font-weight: normal;
            color: rgb(131, 131, 131);
        }
        a::before{
            content: ">>";
            color: rgb(131, 131, 131);
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Github</a></li>
        <li><a href="https://www.youtube.com/c/CursoemV%C3%ADdeo">YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com/">Site</a></li>
    </ul>
</body>
</html>
