<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir este site em diferentes dispositivos ou simplismente diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagemp.png" type="image/png">
        <source media= "(max-width: 1500px)" srcset="imagens/imagemm.png" type="image/png"> 
        <img src="imagens/Sem título.png" alt="imagem flexivel">
        <!--NÃO INVERTA OS SOURCE-->
    </picture>
   <h1>Reproduzindo áudio</h1>
   <p>Vamos aprender a reproduzir áudios em HTML.</p> 
   <audio preload="metadata" autoplay controls loop>
    <source src="midia/da favela ao topo.mp3" type="audio/mpeg">
    <source src="midia/da-favela-ao-topo.ogg" type="audio/ogg">
    <source src="midia/da-favela-ao-topo.wav" type="audio/wav">
    <p>Infelizmente seu navegador não tem compatibilidade com esse áudio.</p>
   </audio> 
   <style>
    audio{
        width: 500px;
        height: 50px;
    }
   </style>
</body>
</html>
